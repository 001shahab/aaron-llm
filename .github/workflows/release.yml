name: Release

# Publishes to PyPI with trusted publishing. There is no long lived PyPI token in
# this repository; the OIDC identity of this workflow is the credential.
#
# One time setup on PyPI, under the project's Publishing settings, add a publisher:
#   owner: 001shahab   repository: aaron-llm
#   workflow: release.yml   environment: pypi
#
# To release: tag, push, then publish a GitHub release for that tag. Publishing the
# release is the trigger, so the notes exist before the artifacts do.
#
#   git tag -a v0.1.0 -m "aaron-llm 0.1.0" && git push origin main --tags
#
# workflow_dispatch runs the gates and builds without publishing, for a dry run.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked dev dependencies
        run: pip install --require-hashes -r requirements-dev.lock
      - name: Install package without dependencies
        run: pip install --no-deps -e .
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy --strict src/aaron
      - run: pytest --cov=aaron --cov-fail-under=90
      - name: Assert exactly two runtime dependencies and no vendor SDKs
        run: python scripts/check_dependencies.py
      - name: Refuse to release a price nobody verified
        run: python -m aaron.registry --check

  build:
    name: build distributions
    runs-on: ubuntu-latest
    needs: [gates]
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assert the tag matches the packaged version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/aaron/_version.py').read_text()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag $tag does not match __version__ $version" >&2
            exit 1
          fi
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Record artifact digests
        id: hash
        run: echo "hashes=$(sha256sum dist/* | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    name: publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/p/aaron-llm
    permissions:
      id-token: write # trusted publishing
      attestations: write # build provenance
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          print-hash: true
