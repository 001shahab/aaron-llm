name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked dev dependencies
        run: pip install --require-hashes -r requirements-dev.lock
      - name: Install package without dependencies
        run: pip install --no-deps -e .
      - run: ruff format --check .
      - run: ruff check --output-format=github .
      - run: mypy --strict src/aaron

  test:
    name: test ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dev dependencies
        run: pip install --require-hashes -r requirements-dev.lock
      - name: Install package without dependencies
        run: pip install --no-deps -e .
      - name: Run tests with coverage
        run: pytest --cov=src/aaron --cov-report=term-missing --cov-fail-under=90

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - name: Fail on any known vulnerability
        run: pip-audit --strict --requirement requirements-dev.lock

  dependency-policy:
    name: runtime dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assert exactly two runtime dependencies and no vendor SDKs
        run: python scripts/check_dependencies.py

  build:
    name: build distributions
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
