# Local inference. Nothing leaves the machine, so the cost is zero and the region
# is 'local', which every residency setting accepts.
ollama/*:
  capabilities: [tools, json_schema, json_mode, streaming]
  input_usd_per_mtok: 0.0
  output_usd_per_mtok: 0.0
  provider_region: local
  last_verified: "2026-09-01"

