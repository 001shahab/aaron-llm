  context_window: 10485760
  capabilities: [tools, vision, json_schema, json_mode, streaming]
  input_usd_per_mtok: 0.0
  output_usd_per_mtok: 0.0
  provider_region: local
  last_verified: "2026-09-18"
  # llama4:latest is the 16x17b Scout build. The 10M window is the model's; the
  # window you actually get is whatever num_ctx the local daemon was given.

# Ollama Cloud. The model runs on ollama.com, not on this machine, so the cost is
# real and the region is deliberately absent: Ollama hosts primarily in the United
# States but may route to Europe or Singapore for capacity, and a residency rule
