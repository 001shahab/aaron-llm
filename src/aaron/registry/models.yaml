# An OpenAI compatible endpoint could be anywhere and cost anything, so no region
# and no price are declared. A policy with a residency requirement will reject it
# until you override this entry with the region your endpoint actually runs in.
openai_compat/*:
  capabilities: [tools, json_schema, json_mode, streaming]
