#
# Model metadata: context windows, list prices per million tokens, capabilities
# and the region the provider processes the request in.
#
# PRICES GO STALE. Run `python -m aaron.registry --check` and verify every entry
# against the provider's pricing page before a release. An unknown or unpriced
# model is never blocked; it is reported with Cost.estimated = True.
#
# provider_region is the jurisdiction the *default* endpoint processes data in.
# It is a coarse signal for the policy layer, not a legal opinion. A dedicated or
# regional deployment changes it, so override this file when you use one.
#
# Keys may use a trailing '*' glob. The longest matching key wins.

